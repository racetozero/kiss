[workspace]
resolver = "2"
members = [
    "crates/kiss-bench",
    "crates/kiss-ai",
    "crates/kiss-agent",
    "crates/kiss-coding",
    "crates/kiss-mcp",
    "crates/kiss-tui",
    "crates/kiss",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/racetozero/kiss"

[workspace.metadata.pi]
repository = "earendil-works/pi"
release = "v0.84.3"
release_commit = "4e58f324fae8ebfa98a3d45181fb248072a2afac"
release_published_at = "2026-08-24T10:50:48Z"
parity_commit = "4e58f324fae8ebfa98a3d45181fb248072a2afac"
parity_checked_at = "2026-08-26T03:44:00Z"
catalog_package = "@earendil-works/pi-ai@0.84.3"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1.10", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = { version = "1.139", features = ["behavior-version-latest"] }
aws-smithy-types = "1.6"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
fs2 = "0.4"
futures = "0.3"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
http = "1"
ignore = "0.4"
jsonschema = { version = "0.33", default-features = false }
kiss-agent = { path = "crates/kiss-agent" }
kiss-ai = { path = "crates/kiss-ai" }
kiss-bench = { path = "crates/kiss-bench" }
kiss-coding = { path = "crates/kiss-coding" }
kiss-mcp = { path = "crates/kiss-mcp" }
kiss-tui = { path = "crates/kiss-tui" }
libc = "0.2"
mdwright-latex = "0.1.3"
mermaid-text = "0.57"
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "rustls-tls-native-roots-no-provider", "system-proxy"] }
reqwest-mcp = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "stream", "rustls-no-provider", "system-proxy"] }
rmcp = { version = "3.1.4", default-features = false, features = ["client", "auth", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "fs", "net"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
