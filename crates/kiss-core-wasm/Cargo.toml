# Browser-local agent kernel; deliberately outside the native root workspace.
[workspace]

[package]
name = "kiss-core-wasm"
version = "0.0.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/racetozero/kiss"
description = "Full KISS agent kernel for browser WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
js-sys = "0.3"
kiss-agent = { path = "../kiss-agent", default-features = false, features = ["portable"] }
kiss-ai = { path = "../kiss-ai", default-features = false, features = ["portable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "console",
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
