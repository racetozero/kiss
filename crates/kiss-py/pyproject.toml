[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "kiss-sdk"
requires-python = ">=3.11"
description = "Embed the kiss coding agent in a Python program"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kiss contributors" }]
keywords = ["agent", "coding-agent", "llm", "sdk"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/racetozero/kiss"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.maturin]
module-name = "kiss_sdk._kiss"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
